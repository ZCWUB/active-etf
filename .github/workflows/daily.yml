name: 每日更新主動式 ETF 持股

on:
  schedule:
    # 台灣時間 18:10 與 22:10（投信多在 16:30～18:00 公告；
    # 第二輪晚一點跑，證交所的淨值到那時才定案，折溢價才準）
    - cron: "10 10 * * 1-5"
    - cron: "10 14 * * 1-5"
  # 改了程式就重新建置並發佈；忽略 data/，否則工作流程自己 commit 資料會觸發自己
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 回補幾天歷史（0 表示不回補）
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-etf
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 安裝無頭瀏覽器（安聯投信專用）
        run: python -m playwright install --with-deps chromium

      - name: 抓 ETF 清單
        run: python scripts/fetch_universe.py

      - name: 抓淨值與折溢價
        run: python scripts/fetch_quotes.py

      - name: 抓收盤行情與成交均價
        run: python scripts/fetch_prices.py

      - name: 抓法人買賣超
        run: python scripts/fetch_institutions.py

      - name: 抓產業別
        run: python scripts/fetch_industries.py

      - name: 抓績效與配息
        run: python scripts/fetch_fundinfo.py

      - name: 抓各投信持股
        run: python scripts/fetch_pcf.py

      - name: 回補歷史（手動觸發時才跑）
        if: github.event_name == 'workflow_dispatch' && inputs.backfill_days != '0'
        run: python scripts/backfill.py --days ${{ inputs.backfill_days }}

      - name: 產生網站資料
        run: python scripts/build_site.py

      # 存檔失敗不該擋住發佈：網站是用剛建置好的目錄上傳的，跟這一步無關
      - name: 把當日資料存回 repo
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet && exit 0
          git commit -m "資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "推不上去（期間有別的 commit），資料下次再存"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
